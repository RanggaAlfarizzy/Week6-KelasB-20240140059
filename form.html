<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asisten Caption UMKM</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <span class="brand">UMKM Hub</span>
    <div class="nav-links">
      <a href="index.html">Etalase</a>
      <a href="form.html" class="active">Asisten Caption</a>
    </div>
  </nav>

  <main class="container narrow">
    <header>
      <h1>Asisten Caption UMKM</h1>
      <p class="subtitle">Isi data produk, lalu buat caption promosi secara otomatis.</p>
    </header>

    <form id="captionForm" novalidate>
      <div class="field">
        <label for="namaProduk">Nama Produk</label>
        <input type="text" id="namaProduk" name="namaProduk" placeholder="Contoh: Keripik Tempe Bu Sari">
        <small id="errorNama" class="error" aria-live="polite"></small>
      </div>

      <div class="field">
        <label for="hargaProduk">Harga (Rp)</label>
        <input type="number" id="hargaProduk" name="hargaProduk" min="0" placeholder="Contoh: 15000">
        <small id="errorHarga" class="error" aria-live="polite"></small>
      </div>

      <div class="field">
        <label for="keunggulan">Keunggulan Produk</label>
        <textarea id="keunggulan" name="keunggulan" rows="4" maxlength="200" placeholder="Contoh: renyah, tanpa pengawet, dibuat dari kedelai lokal"></textarea>
        <small class="counter"><span id="charCount">0</span>/200 karakter</small>
        <small id="errorKeunggulan" class="error" aria-live="polite"></small>
      </div>

      <div class="field">
        <label for="platform">Platform Promosi</label>
        <select id="platform" name="platform">
          <option value="Instagram">Instagram</option>
          <option value="WhatsApp">WhatsApp</option>
          <option value="TikTok">TikTok</option>
          <option value="Facebook">Facebook</option>
        </select>
      </div>

      <div class="actions">
        <button type="submit" id="buatCaption" class="btn primary">Buat Caption</button>
        <button type="button" id="muatContoh" class="btn secondary">Muat Data Contoh</button>
        <button type="reset" class="btn ghost">Reset</button>
      </div>
    </form>

    <p id="statusText" class="status" role="status" aria-live="polite">Siap digunakan.</p>

    <section class="preview" aria-labelledby="judulPreview">
      <h2 id="judulPreview">Preview Caption</h2>
      <p id="captionOutput" class="output" hidden></p>
      <button type="button" id="salinCaption" class="btn secondary" hidden>Salin Caption</button>
    </section>
  </main>

  <footer class="footer">
    <small>Week 6 · Pengembangan Aplikasi Web (TI-501) · Prodi Teknologi Informasi UMY</small>
  </footer>

  <script src="js/form.js"></script>
</body>
</html>
